name: TeeFinder CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install 

      - name: Run tests
        run: npm test -- --watchAll=false --ci # --ci tells test runner that we are in a pipeline, no interactive output, etc..
        env:
          CI: true
          REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}

      # Automatic Build
      - name: Build frontend production bundle
        run: npm run build
        env:
          CI: false 
          REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}

      # Build Verification
      - name: Verify build artifacts
        run: |
          test -f build/index.html || { echo "Missing index.html!"; exit 1; }
          test -d build/static || { echo "Missing static asset directory!"; exit 1; }
          echo "Build verification successful: production bundle is complete."
          ls -lh build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build/
          retention-days: 1