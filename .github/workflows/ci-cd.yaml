name: TeeFinder CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

jobs:

  # Trufflehog secret scanner (https://trufflesecurity.com/blog/running-trufflehog-in-a-github-action)
  TruffleHog: 
    runs-on: ubuntu-latest 
    defaults: 
      run: 
        shell: bash 
    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4 
        with: 
          fetch-depth: 0

      - name: TruffleHog OSS 
        id: trufflehog 
        uses: trufflesecurity/trufflehog@main 
        continue-on-error: true 
        with: 
          path: ./ 
          base: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || '' }}
          head: ${{ github.event_name == 'pull_request' && 'HEAD' || '' }} 
          extra_args: --debug

      - name: Scan Results Status 
        if: steps.trufflehog.outcome == 'failure' 
        run: exit 1
  # CI Jobs
  ci:
    name: Build & Test
    needs: TruffleHog
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run tests
        run: npm test
        env:
          CI: true

      # Automatic Build
      - name: Verify Environment Variables for Build
        run: |
          if [ -z "${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY || (github.event_name == 'pull_request' && 'AIzaSy_PR_BUILD_MOCK_KEY_12345') || '' }}" ]; then
            echo "::error::REACT_APP_GOOGLE_MAPS_API_KEY is not defined!"
            exit 1
          fi


      - name: Build frontend production bundle
        run: npm run build
        env:
          CI: false 
  
      # Build Verification
      - name: Verify build artifacts
        run: |
          test -f build/index.html || { echo "Missing index.html!"; exit 1; }
          test -d build/static || { echo "Missing static asset directory!"; exit 1; }
          echo "Build verification successful: production bundle is complete."
          ls -lh build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build/
          retention-days: 1

  cd:
      name: Deploy to Firebase Hosting
      needs: ci # Only run on successful CI
      if: github.ref == 'refs/heads/main' # Only run on main branch, not on PR, etc
      runs-on: ubuntu-latest

      steps:
        - name: Check out repository
          uses: actions/checkout@v4

        - name: Download build artifact
          uses: actions/download-artifact@v4
          with:
            name: build-artifact
            path: build

        - name: Deploy to Firebase Hosting
          uses: FirebaseExtended/action-hosting-deploy@v0
          with:
            repoToken: ${{ secrets.GITHUB_TOKEN }}
            firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEEFINDER_DEVOPS }}
            channelId: live
            projectId: teefinder-devops
      