steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_NAME}/${_IMAGE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_NAME}/${_IMAGE_NAME}:latest'
      - '.'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_NAME}/${_IMAGE_NAME}:${SHORT_SHA}'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_NAME}/${_IMAGE_NAME}:latest'

  # Step 3: Deploy to Cloud Run (optional - uncomment if using Cloud Run)
  # - name: 'gcr.io/cloud-builders/gke-deploy'
  #   id: 'deploy'
  #   args:
  #     - 'run'
  #     - '--filename=k8s/'
  #     - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_NAME}/${_IMAGE_NAME}:${SHORT_SHA}'
  #     - '--location=${_REGION}'
  #     - '--cluster=${_CLUSTER_NAME}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_NAME}/${_IMAGE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_NAME}/${_IMAGE_NAME}:latest'

options:
  machineType: 'N1_HIGHCPU_8'

substitutions:
  _REGION: 'eu'
  _REGISTRY_NAME: 'teefinder-docker-repo'
  _IMAGE_NAME: 'teefinder-app'
  _CLUSTER_NAME: 'teefinder-cluster'
